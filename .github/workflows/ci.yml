name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # The HOS engine and the log builder are pure functions with no network calls, and
      # every upstream service is mocked in the suite, so this needs no secrets and cannot
      # be broken by OSRM or Nominatim being slow.
      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_DEBUG: "false"
        run: python manage.py test trips --verbosity 2

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      # `pnpm build` runs `tsc -b` before Vite, so this is the typecheck too.
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm build
